  <script>
    /* Theme colours — same palette and storage key as the main app, so the colour you pick there is used here */
    (function (win, doc) {
      'use strict';
      var STORAGE_KEY = 'mt_theme_v1';
      var PALETTE = [
        { id: 'cyan',    name: 'Cyan',    a: '#00e5ff', b: '#3a86ff' },
        { id: 'violet',  name: 'Violet',  a: '#8b6cff', b: '#6c4cff' },
        { id: 'emerald', name: 'Emerald', a: '#00e08a', b: '#00a86b' },
        { id: 'rose',    name: 'Rose',    a: '#ff3d71', b: '#ff0055', pro: true },
        { id: 'orange',  name: 'Orange',  a: '#ff9f1a', b: '#ff5e00', pro: true },
        { id: 'magenta', name: 'Magenta', a: '#ff4fd8', b: '#b44cff', pro: true },
        { id: 'yellow',  name: 'Yellow',  a: '#ffe600', b: '#ffb800', pro: true }
      ];
      function rgb(hex) { var n = parseInt(hex.replace('#', ''), 16); return [(n >> 16) & 255, (n >> 8) & 255, n & 255]; }
      function lum(hex) { var c = rgb(hex); return (0.2126 * c[0] + 0.7152 * c[1] + 0.0722 * c[2]) / 255; }
      function find(id) { for (var i = 0; i < PALETTE.length; i++) if (PALETTE[i].id === id) return PALETTE[i]; return PALETTE[0]; }
      function current() {
        try {
          var s = find(localStorage.getItem(STORAGE_KEY));
          return (s.pro && !win.__MT_PRO) ? PALETTE[0] : s;   /* colours 4-7 are Pro only */
        } catch (e) { return PALETTE[0]; }
      }
      function apply(s) {
        var r = doc.documentElement.style;
        r.setProperty('--primary-accent', s.a);
        r.setProperty('--primary-rgb', rgb(s.a).join(','));
        r.setProperty('--secondary-accent', s.b);
        r.setProperty('--secondary-rgb', rgb(s.b).join(','));
        r.setProperty('--on-acc', (lum(s.a) + lum(s.b)) / 2 > 0.5 ? '#04121a' : '#ffffff');   /* readable text on accent buttons */
      }
      apply(current());
      win.MtTheme = { PALETTE: PALETTE, current: current, refresh: function () { apply(current()); } };
    })(window, document);
  </script>
